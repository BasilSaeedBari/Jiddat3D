{{ define "newsletter_form" }}
<div id="newsletter-form-container">
	<form hx-post="/api/newsletter/subscribe" hx-target="#newsletter-form-container" hx-swap="outerHTML" class="flex flex-col sm:flex-row gap-2">
		<input type="email" name="email" placeholder="Enter your email" required class="flex-grow px-3.5 py-2 rounded-lg bg-[#14181F] border border-[#28303F] text-white placeholder-[#656D7D] focus:outline-none focus:border-[#FF6A1A] transition-all text-xs">
		<input type="hidden" name="source" value="footer">
		<button type="submit" class="px-4 py-2 bg-[#FF6A1A] hover:bg-[#FF8038] text-white font-semibold rounded-lg transition-colors text-xs whitespace-nowrap">Join Updates</button>
	</form>
</div>
{{ end }}
