{{ define "content" }}
<div class="py-12 bg-[#0C0E11] text-[#F4F1EA] min-h-screen" x-data="{
	activeFilter: 'all',
	items: [
		{ id: 1, category: 'fix', name: 'Pakistani Ceiling Fan Regulator Knob', desc: 'Exact replacement for brittle original knob. Features knurled grip and keyed D-shaft.', time: '35 mins', weight: '14g', plastic: 'PETG', cost: 'Rs 45', icon: '🎛️' },
		{ id: 2, category: 'fyp', name: 'Civil Engineering Truss Bridge Model', desc: 'Deflection testing model for final year thesis. Survived 12 kg distributed load.', time: '9 hrs', weight: '180g', plastic: 'PLA+', cost: 'Rs 480', icon: '🌉' },
		{ id: 3, category: 'gifts', name: 'Dual-Color Urdu Calligraphy Living Plate', desc: 'Custom 3D wall art plaque with raised Arabic lettering for Eid and wedding gift.', time: '2 hrs 10m', weight: '48g', plastic: 'PLA', cost: 'Rs 130', icon: '✨' },
		{ id: 4, category: 'fix', name: 'Heavy-Duty 150cc Bike Lever Guard', desc: 'Impact-resistant motorcycle handlebar guard printed to survive drops and scratches.', time: '1 hr 20m', weight: '38g', plastic: 'ABS', cost: 'Rs 110', icon: '🏍️' },
		{ id: 5, category: 'enclosures', name: 'Solar IoT Inverter Monitor Enclosure', desc: 'Custom snap-fit housing with ventilation slots, PCB standoffs, and cable gland ports.', time: '3 hrs 15m', weight: '75g', plastic: 'PETG', cost: 'Rs 220', icon: '📦' },
		{ id: 6, category: 'robotics', name: 'Crash-Resistant FPV Drone GoPro Mount', desc: 'Flexible rubber action camera mount angled at 30 degrees for high-speed quadcopter.', time: '1 hr 45m', weight: '32g', plastic: 'TPU 95A', cost: 'Rs 140', icon: '🚁' },
		{ id: 7, category: 'gifts', name: 'Lithophane Curved Photo Lamp', desc: 'Backlit translucent photo lamp that reveals family picture when LED light turns on.', time: '5 hrs', weight: '95g', plastic: 'White PLA', cost: 'Rs 260', icon: '💡' },
		{ id: 8, category: 'fyp', name: 'Robotic Arm 3-Jaw Gripper Mechanism', desc: 'Geared claw for mechatronics pick-and-place FYP project driven by MG996R servo.', time: '4 hrs 20m', weight: '88g', plastic: 'PETG', cost: 'Rs 240', icon: '🦾' },
		{ id: 9, category: 'fix', name: 'Split AC Remote Wall Cradle', desc: 'Sturdy wall bracket designed for Kenwood and Gree AC remotes with cable routing.', time: '50 mins', weight: '22g', plastic: 'PLA', cost: 'Rs 60', icon: '❄️' }
	],
	matches(cat) {
		return this.activeFilter === 'all' || this.activeFilter === cat;
	}
}">
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
		
		<!-- Breadcrumbs -->
		<nav class="flex items-center gap-2 text-xs text-[#9DA3AF] mb-8 font-mono">
			<a href="/" class="hover:text-white">Home</a>
			<span>/</span>
			<span class="text-white">Print Gallery</span>
		</nav>

		<!-- Header -->
		<div class="border-b border-[#28303F] pb-12 mb-12">
			<div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
				<div>
					<span class="text-[#FF6A1A] font-mono text-xs uppercase tracking-wider">Authentic Lab Portfolio</span>
					<h1 class="font-display text-h1 font-bold text-white tracking-tight mt-1">Things we've printed</h1>
					<p class="text-[#9DA3AF] text-sm md:text-base mt-2 max-w-2xl leading-relaxed">
						Real jobs completed in our Karachi workshop. Each print showcases the exact print duration, material used, weight in grams, and raw rupee cost.
					</p>
				</div>
				<div class="shrink-0">
					<a href="https://wa.me/923001318112?text=Assalam%20o%20Alaikum.%20I%20have%20a%20custom%20part%20I%20want%20printed." target="_blank" rel="noopener noreferrer" class="btn-whatsapp text-xs py-3 px-4 shadow-xl">
						💬 Custom Print Order on WhatsApp
					</a>
				</div>
			</div>

			<!-- Category Filter Chips -->
			<div class="flex flex-wrap items-center gap-2 mt-8 text-xs font-mono">
				<button @click="activeFilter = 'all'" :class="activeFilter === 'all' ? 'bg-[#FF6A1A] text-white' : 'bg-[#14181F] text-[#9DA3AF] hover:text-white'" class="px-3 py-1.5 rounded-lg border border-[#28303F] transition-colors">
					All Prints (9)
				</button>
				<button @click="activeFilter = 'fix'" :class="activeFilter === 'fix' ? 'bg-[#FF6A1A] text-white' : 'bg-[#14181F] text-[#9DA3AF] hover:text-white'" class="px-3 py-1.5 rounded-lg border border-[#28303F] transition-colors">
					Fix & Replace
				</button>
				<button @click="activeFilter = 'fyp'" :class="activeFilter === 'fyp' ? 'bg-[#FF6A1A] text-white' : 'bg-[#14181F] text-[#9DA3AF] hover:text-white'" class="px-3 py-1.5 rounded-lg border border-[#28303F] transition-colors">
					FYP & Engineering
				</button>
				<button @click="activeFilter = 'gifts'" :class="activeFilter === 'gifts' ? 'bg-[#FF6A1A] text-white' : 'bg-[#14181F] text-[#9DA3AF] hover:text-white'" class="px-3 py-1.5 rounded-lg border border-[#28303F] transition-colors">
					Gifts & Urdu Art
				</button>
				<button @click="activeFilter = 'robotics'" :class="activeFilter === 'robotics' ? 'bg-[#FF6A1A] text-white' : 'bg-[#14181F] text-[#9DA3AF] hover:text-white'" class="px-3 py-1.5 rounded-lg border border-[#28303F] transition-colors">
					Robotics & Drone
				</button>
				<button @click="activeFilter = 'enclosures'" :class="activeFilter === 'enclosures' ? 'bg-[#FF6A1A] text-white' : 'bg-[#14181F] text-[#9DA3AF] hover:text-white'" class="px-3 py-1.5 rounded-lg border border-[#28303F] transition-colors">
					Enclosures & IoT
				</button>
			</div>
		</div>

		<!-- Gallery Grid -->
		<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
			<template x-for="item in items" :key="item.id">
				<div x-show="matches(item.category)" x-transition class="workshop-card p-6 flex flex-col justify-between group">
					<div>
						<!-- Part Mockup Card -->
						<div class="h-44 bg-[#14181F] rounded-xl border border-[#28303F] flex flex-col items-center justify-center p-4 mb-4 relative overflow-hidden group-hover:border-[#FF6A1A]/40 transition-colors">
							<span class="text-5xl group-hover:scale-110 transition-transform duration-300" x-text="item.icon"></span>
							<span class="absolute top-3 left-3 text-[10px] font-mono px-2 py-0.5 rounded bg-[#1A1F29] border border-[#28303F] text-[#9DA3AF]" x-text="item.plastic"></span>
						</div>

						<h3 class="font-display font-bold text-white text-lg group-hover:text-[#FF6A1A] transition-colors" x-text="item.name"></h3>
						<p class="text-xs text-[#9DA3AF] mt-1.5 leading-relaxed" x-text="item.desc"></p>
					</div>

					<!-- Bottom Part Metrics (Signature Proof) -->
					<div class="mt-6 pt-4 border-t border-[#28303F]">
						<div class="grid grid-cols-3 gap-2 p-2.5 rounded-lg bg-[#14181F] border border-[#28303F] text-center font-mono text-[11px] mb-3">
							<div>
								<span class="text-[#656D7D] block text-[9px]">TIME</span>
								<span class="text-white font-medium" x-text="item.time"></span>
							</div>
							<div>
								<span class="text-[#656D7D] block text-[9px]">WEIGHT</span>
								<span class="text-white font-medium" x-text="item.weight"></span>
							</div>
							<div>
								<span class="text-[#656D7D] block text-[9px]">RAW COST</span>
								<span class="text-[#3DDC84] font-bold" x-text="item.cost"></span>
							</div>
						</div>

						<a :href="'https://wa.me/923001318112?text=Assalam%20o%20Alaikum.%20I%20saw%20the%20' + encodeURIComponent(item.name) + '%20in%20your%20gallery.%20Can%20I%20order%20one%20like%20this%3F'" target="_blank" rel="noopener noreferrer" class="btn-whatsapp w-full text-xs py-2 justify-center">
							Request Print Like This &rarr;
						</a>
					</div>
				</div>
			</template>
		</div>

	</div>
</div>
{{ end }}
